name: CI (develop)
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - run: DJANGO_DEBUG=false DJANGO_SECRET_KEY=ci python manage.py collectstatic --noinput
      - run: docker build -t ukraine-starts-with-you .
